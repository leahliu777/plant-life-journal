<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7efdf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>植物生活记录</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="phone-shell">
      <header class="app-header">
        <div>
          <p class="kicker">Mon Jardin</p>
          <h1>植物生活记录</h1>
          <p class="subline" id="dateLine"></p>
        </div>
        <button class="round-button" id="notifyBtn" type="button" aria-label="开启提醒" title="开启提醒">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>
        </button>
      </header>

      <main class="app-content">
        <section class="view is-active" id="todayView" aria-label="今日">
          <section class="weather-card">
            <div>
              <p class="card-label">今日养护</p>
              <h2 id="todayTitle"></h2>
              <p id="todayCopy"></p>
            </div>
            <div class="task-ring">
              <span id="dueCount">0</span>
              <small>待完成</small>
            </div>
            <div class="sensor-row">
              <span>湿度 <strong id="humidityText">--</strong></span>
              <span>温度 <strong id="temperatureText">--</strong></span>
              <span>空气 <strong id="airText">--</strong></span>
            </div>
          </section>

          <section class="section-block">
            <div class="section-title">
              <h2>今日任务</h2>
              <button class="link-button" id="completeAllBtn" type="button">全部完成</button>
            </div>
            <div id="taskList" class="task-list"></div>
          </section>

          <section class="notebook-tip">
            <div>
              <p class="card-label">小贴士</p>
              <p id="dailyTip"></p>
            </div>
            <img src="https://images.unsplash.com/photo-1523755231516-e43fd2e8dca5?auto=format&fit=crop&w=600&q=80" alt="浇水壶和植物" />
          </section>
        </section>

        <section class="view" id="plantsView" aria-label="植物档案">
          <div class="section-title top-title">
            <h2>植物档案</h2>
            <span>5 株阳台成员</span>
          </div>
          <div id="plantList" class="plant-list"></div>
        </section>

        <section class="view" id="calendarView" aria-label="花园日历">
          <div class="calendar-card">
            <div class="calendar-head">
              <button class="plain-icon" id="prevMonthBtn" type="button" aria-label="上个月">‹</button>
              <h2 id="monthLabel"></h2>
              <button class="plain-icon" id="nextMonthBtn" type="button" aria-label="下个月">›</button>
            </div>
            <div class="legend">
              <span><i class="legend-dot today-dot"></i>今天</span>
              <span><i class="legend-dot log-dot"></i>已完成</span>
              <span><i class="legend-dot plan-dot"></i>计划中</span>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>

          <section class="section-block stats-block">
            <div class="section-title">
              <h2>本月养护摘要</h2>
              <span id="statsMonthLabel"></span>
            </div>
            <div id="monthStats" class="stats-grid"></div>
          </section>

          <section class="section-block log-block">
            <div class="section-title">
              <div>
                <h2 id="selectedDateLabel"></h2>
                <p id="selectedDateSub"></p>
              </div>
              <button class="add-button" id="openLogBtn" type="button">+ 记录</button>
            </div>
            <div id="selectedPlan" class="selected-plan"></div>
            <div id="logList" class="log-list"></div>
          </section>
        </section>

        <section class="view" id="settingsView" aria-label="设置">
          <div class="section-title top-title">
            <h2>设置</h2>
            <span>温度、提醒、指南</span>
          </div>
          <div class="settings-stack">
            <label class="setting-row">
              <span>
                <strong>热天模式</strong>
                <small>30-35 度时更频繁检查盆土</small>
              </span>
              <input id="heatMode" type="checkbox" />
            </label>
            <label class="field-row">
              <span>植物到家日期</span>
              <input id="arrivalDate" type="date" />
            </label>
            <label class="field-row">
              <span>每日提醒时间</span>
              <input id="reminderTime" type="time" />
            </label>
            <div id="guideList" class="guide-list"></div>
            <button class="danger-button" id="resetBtn" type="button">重置所有记录</button>
          </div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="底部导航">
        <button class="nav-item is-active" data-view="today" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path></svg>
          <span>今日</span>
        </button>
        <button class="nav-item" data-view="plants" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9"></path><path d="M12 13c-4 0-7-2-8-6 4-1 7 0 8 4"></path><path d="M12 15c4 0 7-2 8-6-4-1-7 0-8 4"></path></svg>
          <span>植物</span>
        </button>
        <button class="nav-item" data-view="calendar" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path></svg>
          <span>日历</span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.05.05a2 2 0 1 1-2.83 2.83l-.05-.05A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.08A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.08A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.05-.05a2 2 0 1 1 2.83-2.83l.05.05A1.7 1.7 0 0 0 9 4.6c.38-.15.7-.36 1-.6a1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.08A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.05-.05a2 2 0 1 1 2.83 2.83l-.05.05A1.7 1.7 0 0 0 19.4 9c.15.38.36.7.6 1 .3.25.7.4 1.1.4H21a2 2 0 1 1 0 4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path></svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="modal-overlay" id="logModal">
        <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-handle"></div>
          <h2 id="modalTitle">记录今天的花园</h2>
          <span class="form-label">选择植物</span>
          <div id="plantChips" class="chip-row"></div>
          <span class="form-label">做了什么</span>
          <div id="actionChips" class="chip-row action-row"></div>
          <label class="form-label" for="logNote">备注</label>
          <textarea id="logNote" class="note-input" placeholder="叶片状态、天气、发现的问题..."></textarea>
          <div class="modal-actions">
            <button class="cancel-button" id="closeLogBtn" type="button">取消</button>
            <button class="save-button" id="saveLogBtn" type="button">保存记录</button>
          </div>
        </div>
      </div>
    </div>

    <template id="emptyTaskTemplate">
      <div class="empty-card">
        <strong>今天没有必须完成的任务</strong>
        <p>热天还是看一眼盆土和叶片，薄荷与石斛最值得多观察。</p>
      </div>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
